<main class="workspace"><section class="panel wheel" aria-label="Design process wheel"><div class="wheel-head"><span>Process wheel</span><span class="wheel-current" id="wheelCurrent">Frame</span></div><nav class="wheel-list" id="wheelList" aria-label="Design process stages"></nav></section><section class="panel details" id="detailPanel" aria-live="polite"><div class="detail-top"><div><div class="detail-label" id="detailLabel">01</div><h2 id="stageTitle">Frame the problem</h2><p id="stageDesc"></p></div><div class="top-right"><strong class="big-number" id="bigNumber">96%</strong><span class="phase" id="stagePhase">ALIGN</span></div></div><div class="skill-head"><span>Skills &amp; practices</span><span>Self-rating · 1–5</span></div><div class="skill-body" id="skillBody"></div><div class="note-card"><span class="note-icon" aria-hidden="true">✳</span><div><span class="note-label" id="noteLabel"></span><div class="note-text" id="noteText"></div></div></div><button class="completion-view" id="completionView" type="button" aria-label="Project complete. Tap to return to the beginning." aria-hidden="true" tabindex="-1"><svg class="firework-art" viewBox="0 0 600 360" role="presentation" aria-hidden="true"><g transform="translate(150 150)"><g class="firework-burst burst-one"><path d="M0-48V-94 M34-34 66-66 M48 0H96 M34 34 68 68 M0 48V98 M-34 34-68 68 M-48 0H-96 M-34-34-68-68 M18-44 34-84 M44-18 84-34 M44 18 84 34 M18 44 34 84 M-18 44-34 84 M-44 18-84 34 M-44-18-84-34 M-18-44-34-84"/><circle cx="-72" cy="-12" r="4"/><circle cx="68" cy="-53" r="5"/><circle cx="57" cy="67" r="3"/><circle cx="-42" cy="78" r="4"/><path class="spark" d="M0-9 4-2 12 0 4 3 0 11-3 3-11 0-3-2Z"/></g></g><g transform="translate(425 128)"><g class="firework-burst burst-two"><path d="M0-35V-72 M25-25 52-52 M36 0H74 M25 25 52 52 M0 36V74 M-25 25-52 52 M-36 0H-74 M-25-25-52-52 M14-33 26-64 M33-14 64-26 M33 14 64 26 M14 33 26 64 M-14 33-26 64 M-33 14-64 26 M-33-14-64-26"/><circle cx="-45" cy="-45" r="4"/><circle cx="53" cy="-8" r="3"/><circle cx="-8" cy="59" r="4"/><path class="spark" d="M0-8 3-2 9 0 3 3 0 9-3 3-9 0-3-2Z"/></g></g><g transform="translate(300 238)"><g class="firework-burst burst-three"><path d="M0-27V-59 M19-19 42-42 M28 0H61 M19 19 43 43 M0 28V61 M-19 19-43 43 M-28 0H-61 M-19-19-43-43 M11-24 20-52 M24-11 52-20 M24 11 52 20 M11 24 20 52 M-11 24-20 52 M-24 11-52 20 M-24-11-52-20"/><circle cx="-36" cy="-30" r="3"/><circle cx="38" cy="-28" r="4"/><circle cx="33" cy="35" r="3"/><path class="spark" d="M0-7 3-2 8 0 3 2 0 8-2 2-8 0-2-2Z"/></g></g><path class="twinkle" d="M72 67 77 78 89 82 77 86 72 98 68 86 56 82 68 78Z"/><path class="twinkle twinkle-late" d="M517 193 521 203 532 207 521 211 517 222 513 211 502 207 513 203Z"/><circle class="twinkle dot-late" cx="510" cy="74" r="4"/><circle class="twinkle" cx="94" cy="248" r="3"/></svg><strong class="completion-title">Project Complete</strong></button></section></main>
<script>
const stages=[
{title:'Frame the problem',phase:'ALIGN',desc:'Understand the ask, the people affected, the desired outcome, and the constraints.',skills:[['Translate briefs',4],['Frame an open-ended problem',4],['Client interaction',5]],note:'I enjoy leaning into ambiguous spaces before a solution is named, and I love understanding the problem directly with clients.',noteLabel:'Working note'},
{title:'Break it down',phase:'STRUCTURE',desc:'Turn a large challenge into smaller questions, journeys, dependencies, and workstreams.',skills:[['Mental models',5],['Deconstruct complex challenges',4],['Structure information',4],['Clean up & contextualize',5]],note:'I love taking a complex challenge apart, finding its shape, and making the pieces understandable.',noteLabel:'Strength'},
{title:'Research the landscape',phase:'DISCOVER',desc:'Understand the product, market, organization, competitors, stakeholders, and the wider context.',skills:[['Data crunching',4],['Competitor, stakeholder & client analysis',4],['Product in the past, present & future',4],['Company, visual & system language',5]],note:'I love research: looking at what exists, where the product could go, and how the design can fit the organization’s language.',noteLabel:'Strength'},
{title:'Understand people',phase:'LISTEN',desc:'Learn about people’s needs and behavior through direct conversations and thoughtful research.',skills:[['User surveys',5],['User studies',3],['User research',5],['Talking with people',4]],note:'This is a part of the work I genuinely enjoy and want to stay close to throughout a project.',noteLabel:'Strength'},
{title:'Synthesize & choose',phase:'MAKE SENSE',desc:'Turn evidence into a story, a shared understanding, and clear opportunities for action.',skills:[['Storytelling with evidence',4],['User journeys',5],['Actionable design principles',4],['Design fundamentals',5],['Graphs & quantitative analysis',4]],note:'I’m still learning the graphs and mathematics side. I use AI to help interpret the numbers and build my confidence.',noteLabel:'Learning note'},
{title:'Shape the core experience',phase:'DESIGN',desc:'Use “How might we?” questions to move from pain points toward focused, useful solutions.',skills:[['How might we? framing',4],['Pain points → solutions',5],['Concept matrices',5],['Deciding what to do next',5],['Feature thinking with team & clients',5],['Delightful features',5],['Micro-interactions & textures',5]],note:'I enjoy moving from the basic, friction-free experience toward features and details that make it feel considered.',noteLabel:'Strength'},
{title:'Add meaning & delight',phase:'CRAFT',desc:'Add distinctive, thoughtful details that make the experience feel more human and memorable.',skills:[['Design meaningful moments',4],['Connect delight to user needs',4],['Give the experience its own character',4]],note:'An area I want to grow. I’m interested in it, and still finding my footing in this part of the work.',noteLabel:'Growth note'},
{title:'Prototype & validate',phase:'MAKE · LEARN',desc:'Make ideas tangible, invite feedback, and learn what needs to change before delivery.',skills:[['Animate ideas & prototypes',4],['Use card sorting & other methods',4],['Show clients how ideas could work',5],['AI-assisted making & exploration',4]],note:'I love making and showing ideas. I want to keep improving how early and consistently I validate them.',noteLabel:'Growth note'},
{title:'Deliver & learn',phase:'SHIP · LEARN',desc:'Carry design intent into build, present the work, and keep learning as the product meets the world.',skills:[['Presenting design',5],['Talking with clients',5],['Understanding the product',4],['Partnering through delivery',4],['Learning after release',5]],note:'I enjoy presenting, talking with clients, and understanding the product deeply. Every product has a learning curve, and I want to keep learning through delivery and beyond.',noteLabel:'Working note'}
];
const breakdowns={"Translate briefs":"Very good at understanding briefs, especially the language and vocabulary. I enjoy turning an open ask into a clear problem statement—the first step in guiding the work. I’ve done this since architecture.","Frame an open-ended problem":"I love problems I can frame clearly, then carry that framing forward into a useful solution.","Client interaction":"I love talking with clients, understanding the problem from their perspective, and learning about stakeholders, context, and constraints.","Mental models":"Use mental models to make complex systems and relationships easier to understand and discuss.","Deconstruct complex challenges":"Break a large challenge into smaller questions, flows, dependencies, and manageable decisions.","Structure information":"Organize the pieces into a clear structure so the team can see what connects and what needs attention.","Clean up & contextualize":"Remove noise, bring the right context forward, and make information easier to use.","Data crunching":"Review available data, look for patterns, and use AI to help interpret more mathematical or graph-heavy analysis.","Competitor, stakeholder & client analysis":"Compare the landscape and stakeholder perspectives to find patterns, gaps, and useful references.","Product in the past, present & future":"Study where the product came from, what it does today, and how its market and needs may change.","Company, visual & system language":"Learn the organization’s visual and systematic language so new design feels coherent with its context.","User surveys":"Gather structured feedback across a broader set of people and surface recurring needs.","User studies":"Plan focused studies around real tasks, observe where people succeed or struggle, and capture what to learn.","User research":"Combine methods to understand motivations, behaviors, expectations, and workarounds.","Talking with people":"Listen directly, follow useful threads, and capture people’s language rather than assuming what they mean.","Storytelling with evidence":"Turn research and product signals into a clear story that helps people understand what matters and why.","User journeys":"Map steps, moments, pain points, and opportunities across the end-to-end experience.","Actionable design principles":"Translate what the team learned into practical principles that guide design choices.","Design fundamentals":"Use interaction, information, and visual design principles to keep an experience clear and usable.","Graphs & quantitative analysis":"Interpret charts, metrics, and mathematical findings. I’m still building confidence and use AI to support analysis.","How might we? framing":"Reframe a pain point as an open, focused question that makes room for multiple solution directions.","Pain points → solutions":"Move from a clear user need to practical concepts that address the underlying friction.","Concept matrices":"Compare directions against needs, impact, effort, and feasibility to make tradeoffs easier to see.","Deciding what to do next":"Prioritize by weighing user value, product goals, constraints, and what the team can learn.","Feature thinking with team & clients":"Explore feature ideas with the people building and shaping the product, then check which solve a real need.","Delightful features":"Look for features that make the experience more useful, distinctive, and thoughtful.","Micro-interactions & textures":"Use interaction detail, motion, and visual texture to give feedback and character without adding friction.","Design meaningful moments":"Find moments where a small, thoughtful detail can make the experience more understandable or memorable.","Connect delight to user needs":"Check that expressive details strengthen a real user need instead of distracting from it.","Give the experience its own character":"Create a recognizable feel that fits both the product and its organization.","Animate ideas & prototypes":"Use animation to make timing, transitions, and interaction behavior tangible.","Use card sorting & other methods":"Choose participatory methods to understand how people group and expect information.","Show clients how ideas could work":"Make concepts tangible so clients can react to a real flow or interaction.","AI-assisted making & exploration":"Use AI to explore directions and prototype options, then apply design judgment to refine them.","Presenting design":"Present the design story clearly, explain the reasoning, and make decisions easy to discuss.","Talking with clients":"Build useful dialogue by listening, asking clear questions, and making tradeoffs understandable.","Understanding the product":"Connect design choices to the wider product experience, needs, and goals.","Partnering through delivery":"Stay involved through handoff and build, resolve details with partners, and protect design intent.","Learning after release":"Treat release as another learning point: understand what happened, notice new needs, and carry insights forward."};
const stagePercentages=[96,96,94,94,94,100,93,92,95];
const completionStage={title:'Project Complete',phase:'FINISH'};const wheelStages=[...stages,completionStage];
let current=0;const wheelList=document.getElementById('wheelList');const skillBody=document.getElementById('skillBody');const detailPanel=document.getElementById('detailPanel');const completionView=document.getElementById('completionView');let wheelLocked=false;let unlockTimer;
function addWheelItems(){wheelList.replaceChildren();wheelStages.forEach((stage,index)=>{const button=document.createElement('button');button.type='button';button.className='wheel-item';button.dataset.index=String(index);button.setAttribute('aria-current','false');button.innerHTML='<span class="wheel-num">'+String(index+1).padStart(2,'0')+'</span><span class="wheel-name"></span><span class="wheel-kind"></span>';button.querySelector('.wheel-name').textContent=stage.title;button.querySelector('.wheel-kind').textContent=stage.phase;button.setAttribute('aria-label','Stage '+String(index+1).padStart(2,'0')+': '+stage.title);button.addEventListener('click',()=>selectStage(index,true));wheelList.appendChild(button)})}
function positionWheel(index,behavior){const items=wheelList.querySelectorAll('.wheel-item');const target=items[index];if(!target)return;const horizontal=window.matchMedia('(max-width:760px)').matches;const rowRectBefore=target.getBoundingClientRect();if(horizontal){const spacer=Math.max(0,(wheelList.clientWidth-rowRectBefore.width)/2);wheelList.style.paddingTop='0px';wheelList.style.paddingBottom='0px';wheelList.style.paddingLeft=spacer+'px';wheelList.style.paddingRight=spacer+'px';const listRect=wheelList.getBoundingClientRect();const rowRect=target.getBoundingClientRect();const delta=(rowRect.left+rowRect.width/2)-(listRect.left+listRect.width/2);wheelList.scrollTo({left:wheelList.scrollLeft+delta,behavior:behavior?'smooth':'auto'})}else{const spacer=Math.max(0,(wheelList.clientHeight-rowRectBefore.height)/2);wheelList.style.paddingLeft='';wheelList.style.paddingRight='';wheelList.style.paddingTop=spacer+'px';wheelList.style.paddingBottom=spacer+'px';const listRect=wheelList.getBoundingClientRect();const rowRect=target.getBoundingClientRect();const delta=(rowRect.top+rowRect.height/2)-(listRect.top+listRect.height/2);wheelList.scrollTo({top:wheelList.scrollTop+delta,behavior:behavior?'smooth':'auto'})}}function updateDepth(){const box=wheelList.getBoundingClientRect();const horizontal=window.matchMedia('(max-width:760px)').matches;const center=horizontal?box.left+box.width/2:box.top+box.height/2;const scale=Math.max(1,(horizontal?box.width:box.height)*.52);wheelList.querySelectorAll('.wheel-item').forEach(item=>{const r=item.getBoundingClientRect();const distance=Math.min(1,Math.abs((horizontal?r.left+r.width/2:r.top+r.height/2)-center)/scale);item.style.opacity=String(Math.max(.24,1-distance*.76));item.style.filter='blur('+Math.max(0,distance-.14)*2.4+'px)';})}
function renderSkills(stage,index){skillBody.replaceChildren();stage.skills.forEach((skill,skillIndex)=>{const score=Number(skill[1])||0;const entry=document.createElement('details');entry.className='skill-accordion';const summary=document.createElement('summary');summary.className='skill-row';summary.setAttribute('aria-label',skill[0]+', '+score+' out of 5');const name=document.createElement('span');name.className='skill-name';name.textContent=skill[0];const ticks=document.createElement('span');ticks.className='ticks';for(let i=1;i<=5;i++){const tick=document.createElement('i');tick.className='tick'+(i<=score?' on':'');tick.setAttribute('aria-hidden','true');ticks.appendChild(tick)}const rating=document.createElement('span');rating.className='rating';rating.textContent=score+' / 5';summary.append(name,ticks,rating);const description=document.createElement('div');description.className='skill-detail';description.textContent=breakdowns[skill[0]]||'A developing practice: make the thinking visible, choose a method that fits the question, and refine the outcome through feedback.';entry.append(summary,description);entry.addEventListener('pointerenter',()=>{entry.open=true});entry.addEventListener('pointerleave',()=>{if(entry.dataset.pinned!=='true'&&!entry.matches(':focus-within'))entry.open=false});summary.addEventListener('click',()=>{entry.dataset.pinned=entry.open?'false':'true'});entry.addEventListener('focusin',()=>{entry.open=true});entry.addEventListener('focusout',()=>{setTimeout(()=>{if(entry.dataset.pinned!=='true'&&!entry.matches(':focus-within'))entry.open=false},0)});skillBody.appendChild(entry)})}
function selectStage(index,animate){current=(index+wheelStages.length)%wheelStages.length;const stage=wheelStages[current];const complete=current===stages.length;document.documentElement.style.setProperty('--palette-mix',(complete?100:current/(stages.length-1)*100)+'%');const items=wheelList.querySelectorAll('.wheel-item');items.forEach((item,i)=>{const active=i===current;item.classList.toggle('active',active);item.setAttribute('aria-current',active?'step':'false')});document.getElementById('wheelCurrent').textContent=stage.phase;document.getElementById('topline').style.width=(complete?100:(current+1)/wheelStages.length*100)+'%';if(complete){detailPanel.classList.add('completion-mode');completionView.setAttribute('aria-hidden','false');completionView.tabIndex=0;positionWheel(current,animate);requestAnimationFrame(updateDepth);return}detailPanel.classList.remove('completion-mode','returning');completionView.setAttribute('aria-hidden','true');completionView.tabIndex=-1;document.getElementById('detailLabel').textContent=String(current+1).padStart(2,'0');document.getElementById('stageTitle').textContent=stage.title;document.getElementById('stageDesc').textContent=stage.desc;document.getElementById('bigNumber').textContent=stagePercentages[current]+'%';document.getElementById('stagePhase').textContent=stage.phase;document.getElementById('noteLabel').textContent=stage.noteLabel;document.getElementById('noteText').textContent=stage.note;renderSkills(stage,current);positionWheel(current,animate);requestAnimationFrame(updateDepth)}
function moveStage(delta){selectStage(current+delta,true)}
function handleWheel(event){event.preventDefault();if(wheelLocked)return;wheelLocked=true;moveStage(event.deltaY>0?1:-1);clearTimeout(unlockTimer);unlockTimer=setTimeout(()=>wheelLocked=false,300)}wheelList.addEventListener('wheel',handleWheel,{passive:false});detailPanel.addEventListener('wheel',event=>{const area=event.target.closest('.skill-body');if(area&&area.scrollHeight>area.clientHeight&&((event.deltaY>0&&area.scrollTop+area.clientHeight<area.scrollHeight)||(event.deltaY<0&&area.scrollTop>0)))return;handleWheel(event)},{passive:false});completionView.addEventListener('click',()=>{detailPanel.classList.add('returning');setTimeout(()=>selectStage(0,true),260)});
let touchStartX=0,touchStartY=0;wheelList.addEventListener('touchstart',event=>{touchStartX=event.touches[0].clientX;touchStartY=event.touches[0].clientY},{passive:true});wheelList.addEventListener('touchend',event=>{const horizontal=window.matchMedia('(max-width:760px)').matches;const dx=touchStartX-event.changedTouches[0].clientX;const dy=touchStartY-event.changedTouches[0].clientY;const delta=horizontal?dx:dy;if(Math.abs(delta)>32)moveStage(delta>0?1:-1)},{passive:true});wheelList.addEventListener('scroll',updateDepth,{passive:true});document.addEventListener('keydown',event=>{if(event.target.closest('.skill-accordion')||event.target.isContentEditable)return;if(event.key==='ArrowDown'||event.key==='PageDown'){event.preventDefault();moveStage(1)}else if(event.key==='ArrowUp'||event.key==='PageUp'){event.preventDefault();moveStage(-1)}});window.addEventListener('resize',()=>positionWheel(current,false));let glowTimer;document.addEventListener('pointermove',event=>{if(event.pointerType==='touch')return;document.body.style.setProperty('--mx',event.clientX+'px');document.body.style.setProperty('--my',event.clientY+'px');document.body.classList.add('glow');clearTimeout(glowTimer);glowTimer=setTimeout(()=>document.body.classList.remove('glow'),1300)},{passive:true});
addWheelItems();selectStage(0,false);requestAnimationFrame(()=>positionWheel(0,false));
</script></body></html>
